services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-laravel-app
    ports:
      - "8000:80"
      - "5173:5173"
    volumes:
      - app-data:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=kaloriakompasz
      - DB_USERNAME=sail
      - DB_PASSWORD=password
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kaloriakompasz
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppassword"]
      retries: 5
      timeout: 5s
      interval: 10s

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
  db-data: